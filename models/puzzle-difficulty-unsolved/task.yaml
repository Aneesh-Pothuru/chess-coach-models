# What puzzle-difficulty-unsolved is asked (src/chess_coach_models/tasks.py); its card says why.
dataset: puzzles
kind: regression
label: rating
unit: Lichess puzzle rating points
primary: rmse
reference: gbm-hand
# The numbers every learner reads beside the board: castling rights, and nothing about the solution.
context:
  - castle_own_king
  - castle_own_queen
  - castle_opp_king
  - castle_opp_queen
# The opponent's last move is on the board the solver sees. The squares of the solution are not.
marks: [en_passant, setup_from, setup_to]
# The hand features of the position, and none of the solution's.
hand: [material, mobility, hanging, pawns, kings, setup]
