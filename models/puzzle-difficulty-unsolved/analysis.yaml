# How puzzle-difficulty-unsolved's paper looks at its results (src/chess_coach_models/evals/analysis.py).
# The columns below describe the solution. No learner here reads them: they say where a puzzle's
# difficulty can be told from its position, and where it cannot.
band: {title: Puzzle rating}
describe: [rating, rating_deviation, plays, solver_moves, legal_moves, phase_piece_count]
label: {low: 400, high: 3000, bins: 26}
within: {"100": 100, "200": 200, "300": 300}
slices:
  - {key: moves, column: solver_moves, title: Solution length (moves by the solver), values: [1, 2, 3, 4], rest: 5+}
  - {key: themes, column: themes, title: Theme, tags: 30}
  - {key: first-piece, column: first_piece, title: Piece moved first, values: [1, 2, 3, 4, 5, 6], labels: [pawn, knight, bishop, rook, queen, king]}
  - {key: capture, column: first_capture, title: Capture on the first move, values: [0, 1], labels: ["no", "yes"]}
  - {key: check, column: first_check, title: Check on the first move, values: [0, 1], labels: ["no", "yes"]}
  - {key: sacrifice, column: first_sacrifice, title: Sacrifice on the first move, values: [0, 1], labels: ["no", "yes"]}
  - {key: backward, column: first_backward, title: Retreat on the first move, values: [0, 1], labels: ["no", "yes"]}
  - {key: quiet, column: line_quiet, title: Quiet moves in the solution, values: [0, 1, 2], rest: 3+}
  - {key: mate, column: ends_in_mate, title: Mate at the end of the solution, values: [0, 1], labels: ["no", "yes"]}
  - {key: pieces, column: phase_piece_count, title: Minor and major pieces on the board, edges: [3, 6, 9, 12]}
  - {key: plays, column: plays, title: Attempts on the puzzle, edges: [200, 500, 1000, 5000]}
  - {key: deviation, column: rating_deviation, title: Rating deviation, edges: [75, 80, 90]}
grids:
  - key: moves-pieces
    rows: {column: solver_moves, title: Solution length (moves by the solver), values: [1, 2, 3, 4], rest: 5+}
    columns: {column: phase_piece_count, title: Minor and major pieces on the board, edges: [3, 6, 9, 12]}
examples:
  count: 3
  # What a paper calls the label beside a board.
  truth: True rating
  id: puzzle_id
  moves: [setup, line]
  show: [rating_deviation, plays, themes]
# Runs set against the run each changed, the first over the second: the hand features.
pairs:
  - [transformer-medium-hand, transformer-medium]
# The model that reads the same puzzles with the solution shown. Each run here is set against the run
# of the same name there, on the same test puzzles: what being shown the line is worth to it.
shown: puzzle-difficulty
