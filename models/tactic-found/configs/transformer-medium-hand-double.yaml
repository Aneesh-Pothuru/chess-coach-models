# The medium transformer with hand features on twice the training games: the training rows of the
# larger build `tactics-all`. It goes through them half as often, so it takes as many steps as the run
# it changes and only the number of games differs. Patience is as near the same in steps as whole
# epochs allow.
base: transformer-medium-hand
data:
  train_on: tactics-all
train:
  epochs: 6
  patience: 2
