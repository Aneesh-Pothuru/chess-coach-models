# What think-time is asked (src/chess_coach_models/tasks.py); its card says why.
dataset: game-positions
kind: regression
label: log_spent
unit: log(1 + seconds spent on the move)
primary: mae
reference: gbm-hand
# The numbers every learner reads beside the board.
context:
  - mover_elo
  - opponent_elo
  - log_clock
  - log_opponent_clock
  - log_base
  - increment
  - ply
  - castle_own_king
  - castle_own_queen
  - castle_opp_king
  - castle_opp_queen
# How its paper looks at the results (src/chess_coach_models/evals/analysis.py).
analysis:
  label: {low: 0, high: 5.5, bins: 22}
  # A prediction within a factor of 1.5, 2 and 3 of the time spent: the label is a logarithm.
  within: {"1.5": 0.405465, "2": 0.693147, "3": 1.098612}
  slices:
    - {key: clock, column: clock, title: Seconds on the mover's clock, edges: [30, 60, 120, 300, 480]}
    - {key: seconds, column: spent, title: Seconds the move took, edges: [2, 5, 10, 20, 40, 80]}
    - {key: ply, column: ply, title: Ply of the game, edges: [20, 30, 40, 60, 80]}
    - {key: moves, column: legal_moves, title: Legal moves, edges: [5, 15, 25, 35, 45]}
    - {key: captures, column: legal_captures, title: Captures on offer, values: [0, 1, 2, 3], rest: 4+}
    - {key: check, column: in_check, title: The mover is in check, values: [0, 1], labels: ["no", "yes"]}
    - {key: win, column: win_before, title: The mover's winning chances before the move (percent), edges: [10, 20, 40, 60, 80, 90]}
  grids:
    - key: rating-clock
      rows: {column: mover_elo, title: The mover's rating, edges: [1100, 1400, 1700, 2000]}
      columns: {column: clock, title: Seconds on the mover's clock, edges: [30, 60, 120, 300]}
  examples:
    count: 3
    moves: [last_move, move]
    show: [mover_elo, opponent_elo, clock, opponent_clock, base, increment, spent, win_before]
