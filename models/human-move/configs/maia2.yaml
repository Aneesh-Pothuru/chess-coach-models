# Maia-2 as its authors published it: their rapid model, read with the two ratings of each row and
# scored on the same valid and test rows as every other run. Nothing is fitted here but the one
# temperature every run of this model gets on valid. It needs the maia2 package (docs/compute.md).
needs: maia2
learner:
  kind: maia2
  type: rapid
  player: mover_elo
  against: opponent_elo
