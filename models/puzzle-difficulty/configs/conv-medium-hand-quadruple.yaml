# The convolutional tower with hand features on four times the training games: the training rows of the
# larger build `puzzles-all`. It goes through them a quarter as often, so it takes as many steps as the
# run it changes and only the number of games differs. This model keeps the tower, and it has been
# measured on today's games only. Patience is as near the same in steps as whole epochs allow.
base: conv-medium-hand
data:
  train_on: puzzles-all
train:
  epochs: 3
  patience: 1
