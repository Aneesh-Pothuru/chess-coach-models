# transformer-medium-hand-pretrained with its attention told what each piece attacks on this board, and
# which squares it stands behind one man of (encode/relations.py): the start from the body and the
# telling, the two changes this model's transformer has gained most from, in one network. What the
# attention is told is weighed by weights that start at nothing, so the network takes the whole body and
# begins as it does. Nothing else is changed.
base: transformer-medium-hand-pretrained
learner:
  attacks: true
