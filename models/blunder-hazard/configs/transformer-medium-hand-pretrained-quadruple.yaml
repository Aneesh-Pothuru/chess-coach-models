# transformer-medium-hand-pretrained on four times the training games: the training rows of the larger
# build `game-positions-120k`. It goes through them a quarter as often, so it takes as many steps as the
# run it changes and only the number of games differs. The start from the body is the run this model
# keeps as its best, and it has been measured on today's games only. Patience is as near the same in
# steps as whole epochs allow.
base: transformer-medium-hand-pretrained
data:
  train_on: game-positions-120k
train:
  epochs: 3
  patience: 1
