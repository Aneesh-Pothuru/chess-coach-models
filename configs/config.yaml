seed: 42

data:
  month: "2019-04"
  url: "https://database.lichess.org/standard/lichess_db_standard_rated_2019-04.pgn.zst"
  eval_positions_path: "data/processed/eval_positions.parquet"
  opening_games_path: "data/processed/opening_games.parquet"
  metadata_path: "data/processed/pipeline_metadata.json"
  # Honest laptop defaults. Scale these without changing code on a larger box.
  max_eval_positions: 150000
  max_opening_games: 300000
  opening_plies: 12
  trap_max_ply: 15
  progress_every_games: 10000

rating_bands:
  - {name: "<1100", min: 0, max: 1099, representative_elo: 1000}
  - {name: "1100-1400", min: 1100, max: 1399, representative_elo: 1250}
  - {name: "1400-1700", min: 1400, max: 1699, representative_elo: 1550}
  - {name: "1700-2000", min: 1700, max: 1999, representative_elo: 1850}
  - {name: "2000+", min: 2000, max: 4000, representative_elo: 2150}

thresholds:
  candidate_loss_win_pct: 10.0
  blunder_loss_win_pct: 20.0
  cp_clamp: 1000
  mate_cp: 10000

stockfish:
  path: "auto"
  depth: 12
  multipv: 3
  time_limit_seconds: 0.12
  threads: 2
  hash_mb: 256

maia2:
  enabled: true
  # MPS is fast for single-position scoring but segfaulted in the 5k batch on
  # the reference Mac. CPU is slower and reproducible for committed evals.
  device: "cpu"
  model_type: "rapid"
  weights_dir: "artifacts/maia2"
  max_feature_positions: 5000
  batch_size: 128
  smoke_moves_per_band: 500
  stockfish_time_seconds: 0.03

maia_benchmark:
  # Independent move-match benchmark (issue #1). The month must postdate the
  # released Maia2 training window; see reports/maia_benchmark.md for the
  # provenance argument.
  month: "2025-06"
  url: "https://database.lichess.org/standard/lichess_db_standard_rated_2025-06.pgn.zst"
  positions_path: "data/processed/maia_benchmark_moves.parquet"
  metadata_path: "data/processed/maia_benchmark_sampling.json"
  metrics_path: "reports/maia_benchmark_metrics.json"
  speed: "rapid"
  moves_per_band: 5000
  # Published Maia protocol: skip the first 10 plies and sub-30s clock moves.
  min_ply: 11
  min_clock_seconds: 30.0
  max_moves_per_game: 8
  min_eligible_per_band: 25000
  max_games: 400000
  progress_every_games: 20000
  bootstrap_resamples: 2000
  device: "cpu"
  batch_size: 128

hazard:
  test_fraction: 0.15
  validation_fraction: 0.15
  num_boost_round: 250
  early_stopping_rounds: 30
  class_weight: "balanced"
  min_test_games_per_band: 10
  model_path: "artifacts/models/hazard_v0.joblib"
  metrics_path: "reports/hazard_metrics.json"
  feature_importance_path: "reports/hazard_feature_importance.csv"

concepts:
  # Model 6: multi-label concept tagger on frozen Maia2 embeddings,
  # supervised by Lichess puzzle themes (tactical vocabulary).
  puzzle_url: "https://database.lichess.org/lichess_db_puzzle.csv.zst"
  dataset_path: "data/processed/concept_puzzles.parquet"
  sampling_metadata_path: "data/processed/concept_sampling.json"
  embeddings_path: "data/processed/concept_embeddings.npy"
  model_path: "artifacts/models/concept_tagger.pt"
  metrics_path: "reports/concept_metrics.json"
  max_puzzles: 300000
  min_plays: 200
  # Length buckets, phase tags, eval-derived outcome tags, and source-game
  # tags (master, masterVsMaster) are not concepts; mateIn1-5 are outcome
  # countdowns while named mate patterns stay.
  exclude_themes:
    - master
    - masterVsMaster
    - oneMove
    - short
    - long
    - veryLong
    - opening
    - middlegame
    - endgame
    - crushing
    - advantage
    - equality
    - mateIn1
    - mateIn2
    - mateIn3
    - mateIn4
    - mateIn5
  # Scaled with max_puzzles so the vocabulary threshold stays at the same
  # prevalence (0.5%) across dataset sizes.
  min_theme_count: 1500
  conditioning_elo: 1500
  test_fraction: 0.15
  validation_fraction: 0.15
  hidden_dim: 256
  batch_size: 512
  epochs: 30
  learning_rate: 0.001
  early_stopping_patience: 4
  embed_batch_size: 128
  device: "cpu"

repertoire:
  minimum_node_games: 2000
  recommend_top_n: 5
  recommendation_plies: 4
  wilson_z: 1.96
  critical_line_count: 3
