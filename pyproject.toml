[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-coach-models"
version = "0.2.0"
description = "Models that read chess positions and games, for a chess coaching app"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
dependencies = [
  "lightgbm>=4.3",
  "numpy>=1.26",
  "polars>=2.1",
  "python-chess>=1.999",
  "PyYAML>=6.0",
  "torch>=2.2",
  "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]

[project.scripts]
lab = "chess_coach_models.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

